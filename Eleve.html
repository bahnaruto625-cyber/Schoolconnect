<!DOCTYPE html>
<html>
<head><title>Inscription Élève</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:purple; font-family:Arial; padding:20px}
.box{background:white; padding:20px; border-radius:10px; max-width:400px; margin:auto} 
input{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px} 
button{width:100%; padding:12px; background:purple; color:white; border:none; border-radius:5px; font-weight:bold; font-size:16px}
.info{background:#f3e8ff; padding:10px; border-radius:5px; text-align:center; margin:10px 0}
</style>
</head>
<body>
<div class="box">
<h2>🎒 Inscription Élève</h2>
<input id="nom" placeholder="Nom et Prénom de l'élève">
<input id="classe" placeholder="Classe: ex 7eme annee">
<input id="ecole" placeholder="Nom de l'école">
<input id="parent" placeholder="Nom du Parent/Tuteur">
<input id="tel" placeholder="Téléphone du Parent">

<div class="info">
<b>GRATUIT</b><br>
Accès bloqué si l'école OU le parent n'est pas abonné
</div>

<button onclick="sinscrire()">S'inscrire Gratuitement</button>
<a href="index.html" style="display:block; text-align:center; margin-top:15px">⬅️ Retour</a>
</div>
<script>
function sinscrire(){ 
    alert("Inscription envoyée. L'élève aura accès seulement si l'école et le parent sont actifs.");
}
</script>
</body>
</html>
